[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "adf-core"
version = "1.0.0rc1"
description = "ADF Runtime Engine with Distribution Platform"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "YoghaLabs" }]
dependencies = [
  "PyYAML>=6.0",
]

[project.optional-dependencies]
dev = ["pytest>=7.4", "pytest-cov>=4.1"]

[tool.coverage.run]
source = ["."]
omit = ["tests/*", "**/__pycache__/*"]

[tool.coverage.report]
fail_under = 55
show_missing = true

[project.scripts]
adf = "adf.cli:main"

[tool.setuptools]
packages = [
  "adf",
  "runtime",
  "core",
  "engine",
  "context",
  "memory",
  "bootstrap",
  "registry",
  "parser",
  "loader",
  "shared",
  "utils",
  "contracts",
  "interfaces",
  "plugins",
  "events",
  "hooks",
  "extensions",
  "templates",
  "generator",
  "packages",
  "services",
  "sdk",
  "distribution",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
